name: JitterTests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  id-token: write
  contents: write
  checks: write
  actions: write

env:
  CONFIGURATION: Release
  TEST_RESULTS_DIR: ./TestResults

jobs:
  format:
    name: 检查格式

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore Jitter2/Jitter2.csproj

      - name: 检查格式
        run: dotnet format Jitter2/Jitter2.csproj --verify-no-changes --no-restore

  build-and-test:
    name: 构建并测试（${{ matrix.precision }}）

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        precision:
          - single
          - double

    defaults:
      run:
        working-directory: ./src/JitterTests

    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: 还原依赖
        run: dotnet restore

      - name: 构建单精度测试
        if: matrix.precision == 'single'
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: 构建双精度测试
        if: matrix.precision == 'double'
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore -p:DoublePrecision=true

      - name: 运行单精度测试
        if: matrix.precision == 'single'
        run: |
          mkdir -p ${{ env.TEST_RESULTS_DIR }}

          dotnet test --configuration ${{ env.CONFIGURATION }} --no-restore \
            --test-adapter-path:. --logger "trx;LogFileName=single-precision.trx"

      - name: 运行双精度测试
        if: matrix.precision == 'double'
        run: |
          mkdir -p ${{ env.TEST_RESULTS_DIR }}

          dotnet test --configuration ${{ env.CONFIGURATION }} --no-restore -p:DoublePrecision=true \
            --test-adapter-path:. --logger "trx;LogFileName=double-precision.trx"
