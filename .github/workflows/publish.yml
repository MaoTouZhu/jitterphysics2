# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 发布 NuGet
on:
  workflow_dispatch: # 允许从 GitHub UI 手动运行工作流
  push:
    branches:
      - 'main'       # 推送到 main 分支时运行工作流
  pull_request:
    branches:
      - '*'          # 对所有拉取请求运行工作流
  release:
    types:
      - published    # 发布新的 GitHub Release 时运行工作流

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/Jitter2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取全部历史记录，以便使用 MinVer 自动生成版本号

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 添加 MinVer 与 Reproducible Builds
        run: |
          dotnet add package MinVer
          dotnet add package DotNet.ReproducibleBuilds

      # 打包单精度版本
      - name: 打包单精度
        run: dotnet pack --configuration Release --output ${{ env.NuGetDirectory }}

      # 打包双精度版本
      - name: 打包双精度
        run: dotnet pack --configuration Release -p:DoublePrecision=true --output ${{ env.NuGetDirectory }}

      # 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*

  validate_nuget:

    runs-on: ubuntu-latest
    needs: [create_nuget]
    steps:
      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 下载 NuGet 包
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: 安装 NuGet 校验器
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      - name: 校验 NuGet 包
        run: |
          foreach ($file in Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg) {
              meziantou.validate-nuget-package $file
          }

  run_test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        precision:
          - single
          - double
    name: 运行测试（${{ matrix.precision }}）

    defaults:
      run:
        working-directory: ./src/JitterTests

    steps:
      - uses: actions/checkout@v4
      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore

      - name: 运行测试 - 单精度
        if: matrix.precision == 'single'
        run: dotnet test --configuration Release --no-restore

      - name: 运行测试 - 双精度
        if: matrix.precision == 'double'
        run: dotnet test --configuration Release --no-restore -p:DoublePrecision=true

  deploy:

    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [validate_nuget, run_test]
    steps:
      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 下载 NuGet 包
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: 发布 NuGet 包
        run: |
          dotnet nuget add source --username notgiven688 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/notgiven688/index.json"

          foreach ($file in Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
              dotnet nuget push $file --source "github" --skip-duplicate
          }
