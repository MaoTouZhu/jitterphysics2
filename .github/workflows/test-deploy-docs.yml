name: 构建文档

on:
  pull_request:
    branches:
      - main

jobs:
  test-deploy:
    name: 构建文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 安装 docfx
        run: dotnet tool install -g docfx

      - name: 生成 API 元数据
        run: docfx metadata
        working-directory: docfx

      - name: 构建文档
        run: docfx build
        working-directory: docfx
